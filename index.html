<style>
/* =========================================================
   Thème — tokens issus des maquettes (clair) + variante sombre
   ========================================================= */
:root{
  color-scheme:light dark;
  --bg:#F3EADA;--surf:#FBF6EC;--surf2:#E5D3AF;--surf3:#D4BF96;--seg-on:#FBF6EC;--sep:#DCCBA8;
  --tx:#2A1716;--tx2:#5A4A3C;--tx3:#6E5D4C;
  --acc:#790D16;--acc-tx:#790D16;--acc-ink:#F7EEDC;--acc-soft:rgba(121,13,22,.10);
  --ring1:rgba(121,13,22,.12);--ring2:rgba(121,13,22,.05);
  --ok:#186049;--ok-tx:#186049;
  --bar:#FBF6EC;--toast:#FBF6EC;--sheet:#FBF6EC;
  --danger:#B3261E;--danger-fill:#B3261E;--scrim:rgba(42,23,22,.42);--shadow:0 16px 40px rgba(60,30,10,.2);
  --r-fg:#A3231A;--r-bg:#F2CFC4;--r-solid:#C23B2E;--r-ink:#FFFFFF;
  --o-fg:#8C4A06;--o-bg:#F5D5A8;--o-solid:#E08A2E;--o-ink:#2A1600;
  --g-fg:#3C6B1F;--g-bg:#D6E6BE;--g-solid:#8DBB64;--g-ink:#142306;
  --x-fg:#186049;--x-bg:#C6DFD1;--x-solid:#186049;--x-ink:#FFFFFF;
  --safe-b:max(env(safe-area-inset-bottom),6px);
  --tabbar-h:calc(50px + var(--safe-b));
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Helvetica,Arial,sans-serif;
  --font-num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E1513;--surf:#2B201D;--surf2:#3B2D28;--surf3:#54423A;--seg-on:#5E4A41;--sep:#3E302A;
    --tx:#F3EADA;--tx2:#CDBBA3;--tx3:#A8937E;
    --acc:#A11B27;--acc-tx:#F2959A;--acc-ink:#F7EEDC;--acc-soft:rgba(242,149,154,.13);
    --ring1:rgba(201,48,60,.24);--ring2:rgba(201,48,60,.10);
    --ok:#3A9C78;--ok-tx:#74CFA5;
    --bar:#241A17;--toast:#33271F;--sheet:#2B201D;
    --danger:#FF7A6E;--danger-fill:#C7372B;--scrim:rgba(0,0,0,.55);--shadow:0 16px 40px rgba(0,0,0,.55);
    --r-fg:#FFA394;--r-bg:#4D211B;--r-solid:#D2493B;--r-ink:#FFFFFF;
    --o-fg:#F7B76A;--o-bg:#4A3115;--o-solid:#E08A2E;--o-ink:#2A1600;
    --g-fg:#B7DC8F;--g-bg:#2D3E1E;--g-solid:#8DBB64;--g-ink:#142306;
    --x-fg:#7FD6AF;--x-bg:#173D30;--x-solid:#2E8B68;--x-ink:#FFFFFF;
  }
}
:root[data-theme="dark"]{color-scheme:dark;
    --bg:#1E1513;--surf:#2B201D;--surf2:#3B2D28;--surf3:#54423A;--seg-on:#5E4A41;--sep:#3E302A;
    --tx:#F3EADA;--tx2:#CDBBA3;--tx3:#A8937E;
    --acc:#A11B27;--acc-tx:#F2959A;--acc-ink:#F7EEDC;--acc-soft:rgba(242,149,154,.13);
    --ring1:rgba(201,48,60,.24);--ring2:rgba(201,48,60,.10);
    --ok:#3A9C78;--ok-tx:#74CFA5;
    --bar:#241A17;--toast:#33271F;--sheet:#2B201D;
    --danger:#FF7A6E;--danger-fill:#C7372B;--scrim:rgba(0,0,0,.55);--shadow:0 16px 40px rgba(0,0,0,.55);
    --r-fg:#FFA394;--r-bg:#4D211B;--r-solid:#D2493B;--r-ink:#FFFFFF;
    --o-fg:#F7B76A;--o-bg:#4A3115;--o-solid:#E08A2E;--o-ink:#2A1600;
    --g-fg:#B7DC8F;--g-bg:#2D3E1E;--g-solid:#8DBB64;--g-ink:#142306;
    --x-fg:#7FD6AF;--x-bg:#173D30;--x-solid:#2E8B68;--x-ink:#FFFFFF;
}
:root[data-theme="light"]{color-scheme:light}
.tone-r{--t-fg:var(--r-fg);--t-bg:var(--r-bg);--t-solid:var(--r-solid);--t-ink:var(--r-ink)}
.tone-o{--t-fg:var(--o-fg);--t-bg:var(--o-bg);--t-solid:var(--o-solid);--t-ink:var(--o-ink)}
.tone-g{--t-fg:var(--g-fg);--t-bg:var(--g-bg);--t-solid:var(--g-solid);--t-ink:var(--g-ink)}
.tone-x{--t-fg:var(--x-fg);--t-bg:var(--x-bg);--t-solid:var(--x-solid);--t-ink:var(--x-ink)}
.tone-n{--t-fg:var(--tx2);--t-bg:var(--surf2);--t-solid:var(--surf3);--t-ink:var(--tx)}

/* ========== Base ========== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--tx);font-family:var(--font);font-size:16px;line-height:1.3;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default}
:focus{outline:none}
:focus-visible{outline:2px solid var(--acc-tx);outline-offset:2px}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--acc-soft)}
p,h1,h2,h3{margin:0}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icf{width:24px;height:24px;flex:none;fill:currentColor;stroke:currentColor;stroke-width:1;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* ========== Vues & barre d'onglets ========== */
.view{position:fixed;top:0;left:0;right:0;bottom:var(--tabbar-h);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#view-play{overflow:hidden;display:flex;flex-direction:column}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;height:var(--tabbar-h);padding:4px max(8px,env(safe-area-inset-right)) var(--safe-b) max(8px,env(safe-area-inset-left));display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:start;background:var(--bar);border-top:1px solid var(--sep)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:44px;border:0;background:transparent;padding:0;color:var(--tx3);font-size:10.5px;font-weight:600}
.tab .ic{width:27px;height:27px}
.tab[aria-current="page"]{color:var(--acc-tx)}
body.typing .tabbar{display:none}
body.typing .view{bottom:0}

/* ========== Composants communs ========== */
.page{padding-bottom:36px}
.navrow{height:44px;display:flex;align-items:center;justify-content:flex-end;gap:2px;padding:0 8px}
.navbtn{width:44px;height:44px;border:0;padding:0;border-radius:22px;background:transparent;color:var(--acc-tx);display:inline-flex;align-items:center;justify-content:center}
.navbtn .ic{width:26px;height:26px;stroke-width:2.2}
.lt{padding:0 20px;font-size:34px;line-height:41px;font-weight:800;letter-spacing:-.02em}
.sec{font-size:13px;line-height:18px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--tx2)}
.card{background:var(--surf);border-radius:20px;overflow:hidden}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:3px;min-width:46px;height:28px;padding:0 10px;border-radius:14px;background:var(--t-bg);color:var(--t-fg);font-size:15px;font-weight:700;line-height:1;flex:none}
.pill.lg{height:44px;min-width:84px;border-radius:22px;font-size:24px;padding:0 14px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:54px;border:0;border-radius:18px;background:var(--acc);color:var(--acc-ink);font-size:18px;font-weight:700;text-decoration:none}
.btn:disabled{background:var(--surf2);color:var(--tx3)}
.btn .ic{stroke-width:2.4}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border:0;border-radius:22px;background:var(--acc-soft);color:var(--acc-tx);font-size:15px;font-weight:600}
.btn2 .ic{width:20px;height:20px}
.lnk{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 8px;border:0;background:transparent;color:var(--acc-tx);font-size:16px;font-weight:600;white-space:nowrap}
.lnk:disabled{color:var(--tx3);opacity:.6}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;height:44px;padding:3px;border-radius:13px;background:var(--surf2)}
.seg button{border:0;border-radius:10px;background:transparent;font-size:15px;font-weight:600;color:var(--tx2);padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;padding:56px 36px 24px;text-align:center}
.emblem{width:96px;height:96px;border-radius:48px;background:var(--acc-soft);color:var(--acc-tx);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 14px var(--ring2)}
.emblem .ic{width:44px;height:44px;stroke-width:2}
.empty-t{font-size:22px;line-height:28px;font-weight:800}
.empty-s{font-size:16px;line-height:23px;color:var(--tx2);margin-top:10px}
.dot-sep{width:4px;height:4px;border-radius:2px;background:var(--tx3);margin:0 4px;flex:none}

/* Case à cocher ronde + ligne de commentaire */
.chk{width:44px;height:44px;flex:none;border:0;padding:0;background:transparent;display:flex;align-items:center;justify-content:center}
.chk span{width:24px;height:24px;border-radius:12px;border:2px solid var(--tx3);display:flex;align-items:center;justify-content:center;color:var(--acc-ink);transition:background .15s,border-color .15s}
.chk .ic{width:15px;height:15px;stroke-width:3;opacity:0}
.is-done .chk span{background:var(--acc);border-color:var(--acc)}
.is-done .chk .ic{opacity:1}
.ctext-main{font-size:16px;line-height:21px;white-space:pre-wrap;overflow-wrap:anywhere}
.is-done .ctext-main{color:var(--tx3);text-decoration:line-through}
.ctext-meta{font-size:13px;line-height:17px;color:var(--tx3)}
.rwrap{position:relative;overflow:hidden}
.rwrap + .rwrap .crow{border-top:1px solid var(--sep)}
.crow{position:relative;z-index:1;display:flex;align-items:flex-start;gap:2px;padding:4px 16px 10px 4px;background:var(--surf);transition:transform .22s ease}
.rwrap.open .crow{transform:translateX(-96px)}
.ctext{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:10px 0 0;display:flex;flex-direction:column;gap:3px;color:var(--tx)}
.swdel{position:absolute;right:0;top:0;bottom:0;width:96px;border:0;padding:0;background:var(--danger-fill);color:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:700}
.swdel .ic{width:22px;height:22px}

/* ========== Jouer ========== */
.play-head{flex:none;padding:0 10px 0 20px}
.play-head-row{height:44px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.prog-txt{font-size:15px;font-weight:700;color:var(--tx2)}
.prog-txt b{color:var(--ok-tx)}
.pbar{height:4px;margin-right:10px;border-radius:2px;background:var(--surf2);overflow:hidden}
.pbar>div{height:100%;border-radius:2px;background:var(--ok);transition:width .4s ease}
.relaunch{font-size:15px;color:var(--tx2)}
.relaunch .ic{width:19px;height:19px}
.idle-center{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(36px,8vh,64px);padding:24px}
.draw{width:min(244px,62vw);height:min(244px,62vw);border-radius:50%;border:0;padding:0;background:var(--acc);color:var(--acc-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;font-size:25px;line-height:29px;font-weight:800;letter-spacing:-.01em;box-shadow:0 0 0 16px var(--ring1),0 0 0 34px var(--ring2);transition:transform .12s ease}
.draw:active{transform:scale(.96)}
.draw .ic{width:46px;height:46px;stroke-width:2.1}
.draw span{max-width:150px}
.idle-foot{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.hint{font-size:15px;line-height:21px;color:var(--tx2);max-width:280px;text-align:center}
.empty-play{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;padding:0 32px;text-align:center}
.empty-play .emblem{width:112px;height:112px;border-radius:56px;box-shadow:0 0 0 16px var(--ring2)}
.empty-play .emblem .ic{width:52px;height:52px;stroke-width:1.6}
.empty-play h1{font-size:26px;line-height:31px;font-weight:800;letter-spacing:-.02em}
.empty-play p{font-size:16px;line-height:23px;color:var(--tx2);margin-top:10px}
.empty-play .btn{max-width:300px;height:56px}

/* Tirage (rouleau) */
.draw-center{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:0 20px}
.draw-status{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--acc-tx)}
.draw-status .ic{width:20px;height:20px}
.reel{position:relative;width:100%;max-width:353px;height:330px;border-radius:30px;background:var(--surf);overflow:hidden;flex:none}
.band{position:absolute;left:14px;right:14px;top:129px;height:72px;border-radius:20px;background:var(--acc-soft);box-shadow:inset 0 0 0 2px var(--acc-tx)}
.reel-win{position:absolute;inset:0;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.reel-strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.reel-strip.moving{filter:blur(1.6px)}
.reel-strip{transition:filter .3s ease}
.ri{height:66px;display:flex;align-items:center;justify-content:center;padding:0 30px;color:var(--tx2)}
.ri span{display:block;max-width:100%;font-size:36px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .25s ease,color .25s ease}
.ri.d0 span{color:var(--tx)}
.ri.d1 span{transform:scale(.76);color:var(--tx2)}
.ri.d2 span{transform:scale(.62);color:var(--tx3)}
.mark{position:absolute;top:156px;width:0;height:0;border-top:9px solid transparent;border-bottom:9px solid transparent}
.mark.l{left:0;border-left:11px solid var(--acc-tx)}
.mark.r{right:0;border-right:11px solid var(--acc-tx)}

/* Morceau tiré */
.play-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px}
.play-scroll>*{flex-shrink:0}
.song-head{padding:0 4px;display:flex;flex-direction:column;gap:8px}
.song-title{font-size:40px;line-height:44px;font-weight:800;letter-spacing:-.025em;overflow-wrap:anywhere}
.song-meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;font-size:15px;color:var(--tx2)}
.song-meta .tempo{font-size:21px;font-weight:700;color:var(--tx)}
.bigstep:active{filter:brightness(.92)}
.todo-sec{padding:0 4px;display:flex;flex-direction:column}
.todo-sec .sec{margin-bottom:2px}
.todo-row{display:flex;align-items:center;gap:2px;margin-left:-10px;min-height:44px}
.todo-row .ctext-main{flex:1}
.field{display:block;width:100%;min-height:66px;resize:none;border:0;border-radius:16px;background:var(--surf);color:var(--tx);font:inherit;font-size:16px;line-height:21px;padding:11px 14px}
.field::placeholder,.inp::placeholder{color:var(--tx3)}
.dock{flex:none;padding:10px 16px 12px;background:var(--bg);border-top:1px solid var(--sep);display:flex;flex-direction:column;gap:8px}
body.typing .dock{display:none}
.dock-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.dock-head span{font-size:12px;color:var(--tx3);text-align:right}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.gbtn{height:48px;border:0;border-radius:14px;padding:0;background:var(--t-bg);color:var(--t-fg);font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px;transition:background .12s,box-shadow .12s}
.gbtn.ten{grid-column:span 2}
.gbtn[aria-checked="true"]{background:var(--t-solid);color:var(--t-ink);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--t-solid)}
.gbtn .icf{width:17px;height:17px}

/* Toast & célébration */
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--tabbar-h) + 16px);z-index:45;display:flex;align-items:center;gap:14px;padding:14px 18px 14px 14px;border-radius:24px;background:var(--toast);box-shadow:var(--shadow);opacity:0;transform:translateY(16px);transition:opacity .22s ease,transform .22s ease;pointer-events:none;max-width:480px;margin:0 auto}
.toast.show{opacity:1;transform:none}
.toast.ring{box-shadow:var(--shadow),inset 0 0 0 2px var(--x-solid)}
.tok{width:48px;height:48px;border-radius:24px;flex:none;background:var(--t-solid);color:var(--t-ink);display:flex;align-items:center;justify-content:center}
.tok .ic{width:26px;height:26px;stroke-width:2.8}
.tok .icf{width:26px;height:26px}
.toast-t{font-size:22px;line-height:26px;font-weight:800}
.toast-s{font-size:15px;line-height:20px;color:var(--tx2);margin-top:2px}
.cele-ov{position:fixed;inset:0;z-index:70;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:24px 28px;opacity:0;transition:opacity .25s ease}
.cele-ov.show{opacity:1}
.cele{position:relative;width:100%;max-width:340px;padding:34px 24px 28px;border-radius:32px;background:var(--surf);box-shadow:var(--shadow),inset 0 0 0 2px var(--x-solid);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;transform:scale(.9);transition:transform .35s cubic-bezier(.2,.9,.3,1.25)}
.cele-ov.show .cele{transform:none}
.medal{width:88px;height:88px;border-radius:44px;background:var(--x-solid);color:var(--x-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 10px var(--x-bg)}
.medal .icf{width:44px;height:44px}
.spark{position:absolute;color:var(--x-solid)}
.cele-big{margin-top:14px;font-size:64px;line-height:64px;font-weight:800;letter-spacing:-.03em;color:var(--x-fg)}
.cele-name{font-size:21px;line-height:26px;font-weight:700;overflow-wrap:anywhere}
.cele-foot{width:100%;margin-top:14px;padding-top:16px;border-top:1px solid var(--sep);display:flex;flex-direction:column;gap:8px}
.cele-foot .pbar{height:6px;margin:0;border-radius:3px}
.cele-foot .pbar>div{background:var(--x-solid)}

/* ========== Commentaires ========== */
.pad{padding:12px 16px 0}
.cgroups{padding:22px 16px 0;display:flex;flex-direction:column;gap:22px}
.cgroup{display:flex;flex-direction:column;gap:8px}
.cg-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 6px}
.cg-head h2{font-size:18px;line-height:22px;font-weight:700;overflow-wrap:anywhere}

/* ========== Bibliothèque ========== */

/* =========================================================

/**
 * Calcule le poids de chaque titre.
 * @param {Array} titles   [{id, ...}]
 * @param {Array} sessions [{titleId, note, date}]
 * @param {string|null} lastDrawnId  titre tiré précédemment (exclu sauf si un seul titre)
 * @param {Date|number} now

function computeWeights(titles, sessions, lastDrawnId, now) {
  const nowMs = +now;
  const last = new Map();
  for (const s of sessions) {
    const t = Date.parse(s.date);
    if (Number.isNaN(t)) continue;
    const cur = last.get(s.titleId);
    if (!cur || t >= cur.t) last.set(s.titleId, { note: s.note, t });

  return titles.map((title) => {
    const l = last.get(title.id);
    let base, factor = 1, days = null;
    if (!l) {
      base = CONFIG.WEIGHT_NEVER_PLAYED;
    } else {
      base = l.note >= 10 ? CONFIG.WEIGHT_PERFECT : CONFIG.WEIGHT_BASE_MAX - l.note;
      days = Math.max(0, (nowMs - l.t) / DAY_MS);
      factor = 1 + Math.min(days, CONFIG.AGE_DAYS_CAP) / CONFIG.AGE_DAYS_CAP;
    }
    const weight = title.id === excluded ? 0 : base * factor;
    return { titleId: title.id, weight, base, factor, lastNote: l ? l.note : null, days };

/** Tire un id proportionnellement aux poids. rnd() ∈ [0,1). */
function pickWeighted(weights, rnd = Math.random) {
  const pool = weights.filter((w) => w.weight > 0);
  if (!pool.length) return weights.length ? weights[0].titleId : null;
  const total = pool.reduce((a, w) => a + w.weight, 0);
  let r = rnd() * total;
  for (const w of pool) { r -= w.weight; if (r < 0) return w.titleId; }

/* =========================================================
   Partitions PDF — stockées dans IndexedDB (une par morceau)
   ========================================================= */
const SCORE_MAX_BYTES = 25 * 1024 * 1024;
const ScoreStore = {
  _db: null, meta: new Map(),
  open() {
    if (!this._db) this._db = new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('IndexedDB indisponible'));
      const r = indexedDB.open('saxtrainer-files', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('scores');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return this._db;
  },
  async tx(mode, fn) {
    const d = await this.open();
    return new Promise((res, rej) => {
      const t = d.transaction('scores', mode);
      const req = fn(t.objectStore('scores'));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = t.onabort = () => rej(t.error || new Error('Transaction annulée'));
    });
  },
  has(id) { return this.meta.has(id); },
  get(id) { return this.tx('readonly', (s) => s.get(id)); },
  async put(id, rec) { await this.tx('readwrite', (s) => s.put(rec, id)); this.meta.set(id, { name: rec.name, size: rec.size }); },
  async del(id) { await this.tx('readwrite', (s) => s.delete(id)); this.meta.delete(id); },
  async clear() { await this.tx('readwrite', (s) => s.clear()); this.meta.clear(); },
  async refresh() {
    try {
      const d = await this.open();
      const m = new Map();
      await new Promise((res, rej) => {
        const req = d.transaction('scores', 'readonly').objectStore('scores').openCursor();
        req.onsuccess = () => { const c = req.result; if (!c) return res(); m.set(c.key, { name: c.value.name, size: c.value.size }); c.continue(); };
        req.onerror = () => rej(req.error);
      });
      this.meta = m;
    } catch (e) { /* stockage indisponible : l'appli reste utilisable sans partitions */ }
  },
};
const fmtSize = (b) => (b >= 1048576 ? (b / 1048576).toFixed(1).replace('.', ',') + ' Mo' : Math.max(1, Math.round(b / 1024)) + ' Ko');
const isPdfBuffer = (buf) => { const u = new Uint8Array(buf.slice(0, 1024)); const h = String.fromCharCode(...u); return h.includes('%PDF-'); };
function bufToBase64(buf) {
  const u = new Uint8Array(buf); let bin = '';
  for (let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(bin);
}
function base64ToBuf(b64) { const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; }

let scoreTarget = null;
function pickScore(titleId) { scoreTarget = titleId; $('#scoreFile').click(); }
$('#scoreFile').addEventListener('change', async (e) => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  const id = scoreTarget; scoreTarget = null;
  if (!f || !getTitle(id)) return;
  try {
    if (f.size > SCORE_MAX_BYTES) { showToast({ tone: 'r', icon: 'warn', title: 'Fichier trop lourd', sub: `Maximum ${fmtSize(SCORE_MAX_BYTES)}.` }); return; }
    const data = await f.arrayBuffer();
    if (!isPdfBuffer(data)) { showToast({ tone: 'r', icon: 'warn', title: 'Ce n’est pas un PDF', sub: 'Choisis un fichier .pdf.' }); return; }
    await ScoreStore.put(id, { name: f.name, size: f.size, data, addedAt: new Date().toISOString() });
    renderCurrent();
    showToast({ tone: 'x', icon: 'check', title: 'Partition ajoutée', sub: `${getTitle(id).name} · ${fmtSize(f.size)}` });
  } catch (err) {
    showToast({ tone: 'r', icon: 'warn', title: 'Ajout impossible', sub: 'Le stockage du téléphone a refusé le fichier.' });
  }
});
async function removeScore(id) {
  const t = getTitle(id); if (!t || !ScoreStore.has(id)) return;
  const ok = await confirmSheet({ title: `Supprimer la partition de « ${t.name} » ?`, message: 'Le PDF sera retiré de l’appli. Ton fichier d’origine n’est pas touché.', confirmLabel: 'Supprimer', icon: 'trash' });
  if (!ok) return;
  try { await ScoreStore.del(id); } catch (e) {}
  renderCurrent();
}

/* Visionneuse : PDF.js embarqué (dossier vendor/), rendu sur canvas, zoom au pincement */
let pdfLib = null;
async function loadPdfLib() {
  if (!pdfLib) {
    pdfLib = await import('./vendor/pdf.min.mjs');
    pdfLib.GlobalWorkerOptions.workerSrc = new URL('./vendor/pdf.worker.min.mjs', location.href).href;
  }
  return pdfLib;
}
async function openScore(id) {
  const t = getTitle(id); if (!t) return;
  const ov = document.createElement('div');
  ov.className = 'viewer';
  ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-label', 'Partition de ' + t.name);
  ov.innerHTML = `<div class="v-bar">
      <span class="v-title">${esc(t.name)}</span>
      <button class="navbtn" data-v="out" aria-label="Dézoomer">${ic('minus')}</button>
      <button class="navbtn" data-v="in" aria-label="Zoomer">${ic('plus')}</button>
      <button class="lnk" data-v="close" style="font-weight:700">Fermer</button>
    </div>
    <div class="v-scroll" id="vScroll"><div class="v-pages" id="vPages"><p class="v-msg">Chargement de la partition…</p></div></div>`;
  document.body.appendChild(ov);
  document.body.classList.add('viewer-open');
  requestAnimationFrame(() => ov.classList.add('show'));
  const sc = $('#vScroll', ov), pages = $('#vPages', ov);
  let z = 1, wake = null, closed = false, pdf = null;
  const close = () => {
    if (closed) return; closed = true;
    try { if (wake) wake.release(); } catch (e) {}
    try { if (pdf) pdf.destroy(); } catch (e) {}
    document.body.classList.remove('viewer-open');
    ov.classList.remove('show'); setTimeout(() => ov.remove(), 220);
    document.removeEventListener('visibilitychange', onVis);
  };
  const onVis = async () => { if (!document.hidden && !closed && 'wakeLock' in navigator) { try { wake = await navigator.wakeLock.request('screen'); } catch (e) {} } };
  document.addEventListener('visibilitychange', onVis);
  try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch (e) { wake = null; }

  const setZoom = (nz, cx, cy) => {
    nz = Math.min(4, Math.max(1, nz));
    if (cx === undefined) { cx = sc.clientWidth / 2; cy = sc.clientHeight / 2; }
    const fx = (sc.scrollLeft + cx) / sc.scrollWidth, fy = (sc.scrollTop + cy) / sc.scrollHeight;
    z = nz; pages.style.setProperty('--z', z);
    sc.scrollLeft = fx * sc.scrollWidth - cx; sc.scrollTop = fy * sc.scrollHeight - cy;
  };
  ov.addEventListener('click', (e) => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    if (b.dataset.v === 'close') close();
    else setZoom(z * (b.dataset.v === 'in' ? 1.4 : 1 / 1.4));
  });
  // Pincement et double-tap
  let pinch = null, lastTap = 0;
  const dist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  sc.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) pinch = { d: dist(e.touches), z };
    else if (e.touches.length === 1) {
      const now = Date.now();
      if (now - lastTap < 300) { const r = sc.getBoundingClientRect(); setZoom(z > 1.2 ? 1 : 2.5, e.touches[0].clientX - r.left, e.touches[0].clientY - r.top); lastTap = 0; }
      else lastTap = now;
    }
  }, { passive: true });
  sc.addEventListener('touchmove', (e) => {
    if (pinch && e.touches.length === 2) {
      e.preventDefault();
      const r = sc.getBoundingClientRect();
      const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left, cy = (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top;
      setZoom(pinch.z * dist(e.touches) / pinch.d, cx, cy);
    }
  }, { passive: false });
  sc.addEventListener('touchend', (e) => { if (e.touches.length < 2) pinch = null; }, { passive: true });

  try {
    const rec = await ScoreStore.get(id);
    if (!rec) throw new Error('absent');
    const lib = await loadPdfLib();
    pdf = await lib.getDocument({ data: new Uint8Array(rec.data.slice(0)) }).promise;
    if (closed) return;
    pages.innerHTML = '';
    const baseW = Math.max(window.innerWidth, window.innerHeight);
    const dpr = Math.min(window.devicePixelRatio || 2, 3);
    for (let n = 1; n <= Math.min(pdf.numPages, 12); n++) {
      const page = await pdf.getPage(n);
      if (closed) return;
      const vp1 = page.getViewport({ scale: 1 });
      let scale = (baseW - 24) / vp1.width * dpr * 2;                       // netteté jusqu'à ×2 de zoom
      const maxPx = 12e6;                                                   // limite mémoire des canvas iOS
      if (vp1.width * vp1.height * scale * scale > maxPx) scale = Math.sqrt(maxPx / (vp1.width * vp1.height));
      const vp = page.getViewport({ scale });
      const cv = document.createElement('canvas');
      cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
      cv.setAttribute('role', 'img'); cv.setAttribute('aria-label', `Partition de ${t.name}, page ${n}`);
      pages.appendChild(cv);
      await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
    }
  } catch (err) {
    if (!closed) pages.innerHTML = `<p class="v-msg">Impossible d’afficher cette partition.<br>Essaie de la supprimer puis de la rajouter.</p>`;
  }
}

function playHeader(idx, withRelaunch) {
  const total = db.titles.length, done = perfectCount(idx);
  const pct = total ? Math.round(done / total * 100) : 0;
  return `<header class="play-head">
    <div class="play-head-row">
      <p class="num prog-txt"><b>${done}</b> / ${plural(total, 'titre', 'titres')} à 10</p>
      ${withRelaunch ? `<button class="lnk relaunch" data-action="draw">${ic('shuffle')}Relancer le tirage</button>` : ''}
    </div>
    <div class="pbar" role="progressbar" aria-label="Titres à 10" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}"><div style="width:${pct}%"></div></div>
  </header>`;
}

function renderPlay() {
  const v = $('#view-play');
  if (!db.titles.length) {
    ui.play = { state: 'idle' };
    v.innerHTML = `<div class="empty-play">
      <div class="emblem">${ic('music')}</div>
      <div><h1>Bienvenue dans Sax Trainer</h1>
      <p>Ajoute tes morceaux avec leur tempo. À chaque séance, l’appli tirera au sort celui à travailler, jusqu’à 10/10 partout.</p></div>
      <button class="btn" data-action="first-add">${ic('plus')}Ajouter mes morceaux</button>
    </div>`;
    return;
  }
  if (ui.play.state === 'drawing') return; // l'animation gère l'affichage
  if (ui.play.state === 'active' && !getTitle(ui.play.titleId)) ui.play = { state: 'idle' };
  const idx = indexStats();
  if (ui.play.state !== 'active') {
    const todo = openComments().length;
    v.innerHTML = `${playHeader(idx, false)}
      <div class="idle-center">
        <button class="draw" data-action="draw">${ic('shuffle')}<span>Tirer un morceau</span></button>
        <div class="idle-foot">
          <p class="hint">Les titres les moins bien notés sortent plus souvent.</p>
          ${todo ? `<button class="btn2" data-action="goto-todo">${ic('comment')}<span>${plural(todo, 'commentaire', 'commentaires')} à faire</span></button>` : ''}
        </div>
      </div>`;
    return;
  }
  const p = ui.play, t = getTitle(p.titleId), st = idx.get(t.id);
  const lastLine = st.last === null
    ? `${pill(null)}<span>Jamais joué</span>`
    : `<span>Dernière fois</span>${pill(st.last, { of: true })}<span>· ${relDay(st.lastDate)}</span>`;
  const todos = p.todoIds.map((id) => db.comments.find((c) => c.id === id)).filter(Boolean);
  let grid = '';
  for (let n = 0; n <= 10; n++) {
    grid += `<button class="gbtn num tone-${tone(n)}${n === 10 ? ' ten' : ''}" role="radio" aria-checked="${p.note === n}" aria-label="${n} sur 10" data-action="note" data-n="${n}">${n}${n === 10 ? icf('star') : ''}</button>`;
  }
  v.innerHTML = `${playHeader(idx, true)}
    <div class="play-scroll" id="playScroll">
      <div class="song-head">
        <h1 class="song-title">${esc(t.name)}</h1>
        <div class="song-meta"><span class="num tempo">♩ = ${t.tempo}</span><span class="dot-sep"></span>${lastLine}</div>
      </div>
      ${ScoreStore.has(t.id) ? `<div style="padding:0 4px"><button class="btn2" data-action="score-open" data-id="${t.id}">${ic('doc')}Ouvrir la partition</button></div>` : ''}
      ${todos.length ? `<section class="todo-sec"><h2 class="sec">À faire sur ce morceau</h2>
        ${todos.map((c) => `<div class="todo-row${c.done ? ' is-done' : ''}" data-cid="${c.id}">
          <button class="chk" data-action="comment-toggle" data-id="${c.id}" aria-label="${c.done ? 'Marquer comme à faire' : 'Marquer comme fait'}"><span>${ic('check')}</span></button>
          <p class="ctext-main">${esc(c.text)}</p></div>`).join('')}
      </section>` : ''}
      <textarea class="field" id="playComment" rows="2" aria-label="Commentaire sur la séance" placeholder="Un point à retravailler, une modif sur la partition…">${esc(p.comment)}</textarea>
    </div>
    <div class="dock">
      <div class="dock-head"><h2 class="sec">Ta note</h2><span>0 = à retravailler · 10 = sans erreur</span></div>
      <div class="grid" role="radiogroup" aria-label="Note de 0 à 10">${grid}</div>
      <button class="btn" id="validateBtn" data-action="validate"${p.note === null ? ' disabled' : ''}>${ic('check')}Valider</button>
    </div>`;
  const ta = $('#playComment');
  autoGrow(ta);
  ta.addEventListener('input', () => { ui.play.comment = ta.value; autoGrow(ta); });
}
function autoGrow(ta) { ta.style.height = 'auto'; ta.style.height = Math.min(Math.max(ta.scrollHeight, 66), 180) + 'px'; }

function startPlaying(id) {
  const t = getTitle(id); if (!t) return;
  ui.play = {
    state: 'active', titleId: id, note: null, comment: '',
    todoIds: openComments(id).sort(byNewest).map((c) => c.id),
  };
  renderPlay();
}

let drawTimers = [];
function startDraw() {
  if (ui.play.state === 'drawing' || !db.titles.length) return;
  const weights = computeWeights(db.titles, db.sessions, db.meta.lastDrawnTitleId, new Date());
  const id = pickWeighted(weights);
  if (!id) return;
  db.meta.lastDrawnTitleId = id;
  save();
  ui.play = { state: 'drawing', titleId: id };
  document.activeElement && document.activeElement.blur && document.activeElement.blur();

  // Rouleau : noms aléatoires, le titre tiré au centre, suivi de 2 noms
  const names = [];
  const pickName = () => db.titles[Math.floor(Math.random() * db.titles.length)].name;
  const N = 16;
  for (let i = 0; i < N; i++) {
    let n = pickName();
    if (db.titles.length > 1) { let guard = 0; while (names.length && n === names[names.length - 1] && guard++ < 8) n = pickName(); }
    names.push(n);
  }
  const target = names.length;
  names.push(getTitle(id).name, pickName(), pickName());
  const H = 66, C = 132;
  const v = $('#view-play');
  v.innerHTML = `${playHeader(indexStats(), false)}
    <div class="draw-center">
      <p class="draw-status" role="status">${ic('shuffle')}Tirage…</p>
      <div class="reel" aria-hidden="true">
        <div class="band"></div>
        <div class="reel-win"><div class="reel-strip" id="reelStrip">${names.map((n) => `<div class="ri"><span>${esc(n)}</span></div>`).join('')}</div></div>
        <div class="mark l"></div><div class="mark r"></div>
      </div>
      <p class="hint">Le rouleau ralentit puis s’arrête sur le morceau à travailler.</p>
    </div>`;
  const strip = $('#reelStrip');
  const items = Array.from(strip.children);
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dur = reduce ? 0 : CONFIG.DRAW_ANIM_MS;
  strip.style.transform = `translateY(${C - 2 * H}px)`;
  strip.getBoundingClientRect();
  strip.classList.add('moving');
  strip.style.transition = `transform ${dur}ms cubic-bezier(.12,.62,.22,1.08), filter .3s ease`;
  strip.style.transform = `translateY(${C - target * H}px)`;
  drawTimers.forEach(clearTimeout);
  drawTimers = [
    setTimeout(() => strip.classList.remove('moving'), dur * 0.55),
    setTimeout(() => items.forEach((el, i) => { el.className = 'ri d' + Math.min(Math.abs(i - target), 2); }), dur * 0.9),
    setTimeout(() => {
      if (ui.play.state === 'drawing' && ui.play.titleId === id) {
        startPlaying(id);
        const s = $('#view-play .play-scroll'); if (s) s.scrollTop = 0;
      }
    }, dur + (reduce ? 250 : 450)),
  ];
}

function validatePlay() {
  const p = ui.play;
  if (p.state !== 'active' || p.note === null) return;
  const t = getTitle(p.titleId); if (!t) return;
  const prevLast = indexStats().get(t.id).last;
  const now = new Date().toISOString();
  db.sessions.push({ id: uuid(), titleId: t.id, note: p.note, date: now });
  const text = (p.comment || '').trim();
  if (text) db.comments.push({ id: uuid(), titleId: t.id, text, createdAt: now, done: false, doneAt: null });
  save();
  const note = p.note;
  ui.play = { state: 'idle' };
  document.body.classList.remove('typing');
  renderPlay();
  const idx = indexStats();
  const done = perfectCount(idx), total = db.titles.length;
  if (note === 10 && prevLast !== 10) {
    showCelebration(t, done, total);
  } else if (note === 10) {
    showToast({ tone: 'x', icon: 'star', ring: true, title: '10/10', sub: `${t.name} · ${done} / ${total} titres à 10` });
  } else {
    showToast({ tone: tone(note), icon: 'check', title: `Noté ${note}/10`, sub: `${t.name}${text ? ' · 1 commentaire ajouté' : ''}` });
  }
}

/* =========================================================
   Toast & célébration
   ========================================================= */
let toastTimer = null;
function showToast({ tone: tn = 'x', icon = 'check', title, sub = '', ring = false, ms = 1800 }) {
  const el = $('#toast');
  const isFill = icon in ICF;
  el.className = `toast tone-${tn}${ring ? ' ring' : ''}`;
  el.innerHTML = `<span class="tok">${isFill ? icf(icon) : ic(icon)}</span>
    <div style="min-width:0"><p class="num toast-t"${tn === 'x' && ring ? ' style="color:var(--x-fg)"' : ''}>${esc(title)}</p>${sub ? `<p class="toast-s">${esc(sub)}</p>` : ''}</div>`;
  requestAnimationFrame(() => el.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}
function showCelebration(t, done, total) {
  const pct = total ? Math.round(done / total * 100) : 0;
  const ov = document.createElement('div');
  ov.className = 'cele-ov';
  ov.setAttribute('role', 'status');
  ov.innerHTML = `<div class="cele">
    ${icf('spark', 'spark', 'left:34px;top:30px;width:20px;height:20px')}
    ${icf('spark', 'spark', 'left:64px;top:92px;width:11px;height:11px;opacity:.7')}
    ${icf('spark', 'spark', 'right:40px;top:40px;width:15px;height:15px')}
    ${icf('spark', 'spark', 'right:62px;top:104px;width:22px;height:22px;opacity:.85')}
    ${icf('spark', 'spark', 'right:30px;top:150px;width:10px;height:10px;opacity:.6')}
    <div class="medal">${icf('star')}</div>
    <p class="num cele-big">10/10</p>
    <p class="cele-name">${esc(t.name)}, sans erreur</p>
    <p class="hint">Un titre de plus à 10. Bravo.</p>
    <div class="cele-foot">
      <p class="num" style="font-size:16px;font-weight:700"><span style="color:var(--x-fg)">${done}</span> / ${plural(total, 'titre', 'titres')} à 10</p>
      <div class="pbar"><div style="width:${pct}%"></div></div>
    </div>
  </div>`;
  document.body.appendChild(ov);
  requestAnimationFrame(() => ov.classList.add('show'));
  const close = () => { ov.classList.remove('show'); setTimeout(() => ov.remove(), 260); };
  ov.addEventListener('click', close);
  setTimeout(close, 3200);
}

   Onglet Commentaires

function commentRow(c, { swipe = true, date = true } = {}) {
  return `<div class="rwrap${swipe ? ' swipeable' : ''}${c.done ? ' is-done' : ''}" data-cid="${c.id}">
    ${swipe ? `<button class="swdel" data-action="comment-delete" data-id="${c.id}" aria-label="Supprimer le commentaire">${ic('trash')}<span>Supprimer</span></button>` : ''}
    <div class="crow">
      <button class="chk" data-action="comment-toggle" data-id="${c.id}" aria-label="${c.done ? 'Marquer comme à faire' : 'Marquer comme fait'}"><span>${ic('check')}</span></button>
      <button class="ctext" data-action="comment-edit" data-id="${c.id}" aria-label="Modifier le commentaire">
        <span class="ctext-main">${esc(c.text)}</span>${date ? `<span class="ctext-meta">${relDay(c.createdAt)}</span>` : ''}
      </button>
    </div>
  </div>`;
}
function renderComments() {
  const f = ui.commentsFilter;
  const keep = (c) => (f === 'all' ? true : f === 'done' ? c.done : !c.done);
  const groupsMap = new Map();
  for (const c of db.comments) {
    if (!keep(c)) continue;
    if (!groupsMap.has(c.titleId)) groupsMap.set(c.titleId, []);
    groupsMap.get(c.titleId).push(c);
  }
  const groups = [];
  for (const [tid, items] of groupsMap) {
    const t = getTitle(tid); if (!t) continue;
    items.sort(byNewest);
    const todo = items.filter((c) => !c.done).length, done = items.length - todo;
    const parts = []; if (todo) parts.push(todo + ' à faire'); if (done) parts.push(done + (done > 1 ? ' faits' : ' fait'));
    groups.push({ t, items, count: parts.join(' · '), newest: Date.parse(items[0].createdAt) });
  }
  groups.sort((a, b) => b.newest - a.newest);
  const seg = (k, l) => `<button data-action="comments-filter" data-f="${k}" aria-pressed="${f === k}">${l}</button>`;
  const emptyTitle = !db.comments.length ? 'Aucun commentaire pour l’instant'
    : f === 'todo' ? 'Aucun commentaire à faire 🎷' : f === 'done' ? 'Aucun commentaire fait' : 'Aucun commentaire pour l’instant';
  $('#view-comments').innerHTML = `<div class="page">
    <div class="navrow"><button class="navbtn" data-action="comment-new" aria-label="Ajouter un commentaire">${ic('plus')}</button></div>
    <h1 class="lt">Commentaires</h1>
    <div class="pad"><div class="seg" role="group" aria-label="Filtre">${seg('todo', 'À faire')}${seg('done', 'Faits')}${seg('all', 'Tous')}</div></div>
    ${groups.length ? `<div class="cgroups">${groups.map((g) => `<section class="cgroup">
        <div class="cg-head"><h2>${esc(g.t.name)}</h2><span>${g.count}</span></div>
        <div class="card">${g.items.map((c) => commentRow(c)).join('')}</div>
      </section>`).join('')}</div>`
    : `<div class="empty"><div class="emblem">${ic('check')}</div><div><p class="empty-t">${emptyTitle}</p><p class="empty-s">Les points notés après chaque morceau s’afficheront ici.</p></div></div>`}
  </div>`;
}

function toggleComment(id) {
  const c = db.comments.find((x) => x.id === id); if (!c) return;
  c.done = !c.done;
  c.doneAt = c.done ? new Date().toISOString() : null;
  save();
  $$(`[data-cid="${CSS.escape(id)}"]`).forEach((el) => {
    el.classList.toggle('is-done', c.done);
    const b = $('.chk', el); if (b) b.setAttribute('aria-label', c.done ? 'Marquer comme à faire' : 'Marquer comme fait');
  });
  if (ui.tab === 'comments' && ui.commentsFilter !== 'all') setTimeout(() => { if (ui.tab === 'comments') renderComments(); }, 450);
  else if (ui.tab === 'comments') renderComments();
  else if (ui.tab === 'library') setTimeout(() => { if (ui.tab === 'library') renderLibrary(); }, 450);
}
async function deleteComment(id) {
  const c = db.comments.find((x) => x.id === id); if (!c) return false;
  const ok = await confirmSheet({ title: 'Supprimer ce commentaire ?', message: c.text.length > 90 ? c.text.slice(0, 90) + '…' : c.text, confirmLabel: 'Supprimer', icon: 'trash' });
  if (!ok) { closeSwipes(); return false; }
  db.comments = db.comments.filter((x) => x.id !== id);
  save();
  renderCurrent();
  return true;
}

function openCommentSheet({ commentId = null, titleId = null } = {}) {
  const c = commentId ? db.comments.find((x) => x.id === commentId) : null;
  if (!c && !db.titles.length) { showToast({ tone: 'o', icon: 'warn', title: 'Aucun morceau', sub: 'Ajoute d’abord un morceau dans la Bibliothèque.' }); return; }
  const titles = db.titles.slice().sort(sortByName);
  const sel = c ? c.titleId : (titleId || (ui.play.state === 'active' ? ui.play.titleId : titles[0].id));
  openSheet({
    title: c ? 'Modifier le commentaire' : 'Nouveau commentaire',
    body: `<label class="fld"><span class="sec">Morceau</span>
        <select class="inp" id="cTitle">${titles.map((t) => `<option value="${t.id}"${t.id === sel ? ' selected' : ''}>${esc(t.name)}</option>`).join('')}</select></label>
      <label class="fld"><span class="sec">Commentaire</span>
        <textarea class="field tall" id="cText" placeholder="Ex. Changer le doigté mesure 12">${c ? esc(c.text) : ''}</textarea></label>
      ${c ? `<div class="card sheet-danger"><button class="arow danger" data-sheet="delete">${ic('trash')}Supprimer le commentaire</button></div>` : ''}`,
    canSave: (root) => $('#cText', root).value.trim().length > 0,
    onMount: (root) => { if (!c) setTimeout(() => $('#cText', root).focus(), 350); },
    onSave: (root) => {
      const text = $('#cText', root).value.trim();
      const tid = $('#cTitle', root).value;
      if (!text || !getTitle(tid)) return false;
      if (c) { c.text = text; c.titleId = tid; }
      else db.comments.push({ id: uuid(), titleId: tid, text, createdAt: new Date().toISOString(), done: false, doneAt: null });
      save(); renderCurrent();
      return true;
    },
    onAction: async (act, close) => {
      if (act === 'delete' && c) { const ok = await deleteComment(c.id); if (ok) close(); }
    },
  });
}

function evolutionChart(t, sessions) {
  const list = sessions.slice(-CONFIG.CHART_MAX_POINTS);
  const n = list.length, x0 = 30, x1 = 315;
  const xs = (k) => (n > 1 ? x0 + k * (x1 - x0) / (n - 1) : (x0 + x1) / 2);
  const ys = (v) => 132 - v * 12;
  const pts = list.map((s, k) => `${xs(k).toFixed(1)},${ys(s.note)}`).join(' ');
  const best = list.reduce((m, s) => Math.max(m, s.note), 0);
  return `<svg class="chart" viewBox="0 0 329 168" role="img" aria-label="Évolution des notes de ${esc(t.name)}, de ${list[0].note} à ${list[n - 1].note} sur 10, meilleure note ${best}">
    <line class="cgoal" x1="26" y1="12" x2="329" y2="12"/>
    <line class="cgrid" x1="26" y1="72" x2="329" y2="72"/>
    <line class="cgrid" x1="26" y1="132" x2="329" y2="132"/>
    <text class="ctx" x="0" y="16">10</text><text class="ctx" x="7" y="76">5</text><text class="ctx" x="7" y="136">0</text>
    ${n > 1 ? `<polyline class="cline" points="${pts}"/>` : ''}
    ${list.map((s, k) => `<circle class="cdot tone-${tone(s.note)}" cx="${xs(k).toFixed(1)}" cy="${ys(s.note)}" r="${k === n - 1 ? 7 : 5}"/>`).join('')}
    <text class="ctx" x="22" y="160">${fmtShort(list[0].date)}</text>
    ${n > 1 ? `<text class="ctx" x="329" y="160" text-anchor="end">${fmtShort(list[n - 1].date)}</text>` : ''}
  </svg>`;
}

        t.name = name; t.tempo = tempo;
        save(); renderCurrent();
        showToast({ tone: 'x', icon: 'check', title: 'Morceau modifié', sub: `${name} · ♩ = ${tempo}` });
      } else {
        db.titles.push({ id: uuid(), name, tempo, createdAt: new Date().toISOString() });
        save(); renderCurrent();
        showToast({ tone: 'x', icon: 'check', title: 'Morceau ajouté', sub: `${name} · ♩ = ${tempo}` });
      }
      return true;
    },
  });
}

async function deleteTitle(id) {
  const t = getTitle(id); if (!t) return;
  const ns = db.sessions.filter((s) => s.titleId === id).length;
  const nc = db.comments.filter((c) => c.titleId === id).length;
  const ok = await confirmSheet({
    title: `Supprimer « ${t.name} » et tout son historique ?`,
    message: `${ns || nc ? `${plural(ns, 'note', 'notes')} et ${plural(nc, 'commentaire', 'commentaires')} seront effacés. ` : ''}Cette action est définitive.`,
    confirmLabel: 'Supprimer', icon: 'trash',
  });
  if (!ok) return;
  db.titles = db.titles.filter((x) => x.id !== id);
  db.sessions = db.sessions.filter((s) => s.titleId !== id);
  db.comments = db.comments.filter((c) => c.titleId !== id);
  if (db.meta.lastDrawnTitleId === id) db.meta.lastDrawnTitleId = null;
  if (ui.play.titleId === id) ui.play = { state: 'idle' };
  try { await ScoreStore.del(id); } catch (e) {}
  save();
  ui.lib.view = 'list'; ui.lib.ficheId = null;
  renderLibrary();
  showToast({ tone: 'n', icon: 'trash', title: 'Morceau supprimé', sub: t.name });
}

/* Export / import */
async function exportData() {
  const d = new Date();
  const p2 = (n) => String(n).padStart(2, '0');
  const fname = `saxtrainer-${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}.json`;
  const files = [];
  for (const [tid, m] of ScoreStore.meta) {
    if (!getTitle(tid)) continue;
    try { const r = await ScoreStore.get(tid); if (r) files.push({ titleId: tid, name: m.name, data: bufToBase64(r.data) }); } catch (e) {}
  }
  const json = JSON.stringify(files.length ? Object.assign({}, db, { files }) : db, null, 2);
  const markDone = () => { db.meta.lastExportAt = new Date().toISOString(); save(); if (ui.tab === 'library') renderLibrary(); };
  let file = null;
  try { file = new File([json], fname, { type: 'application/json' }); } catch (e) {}
  if (file && navigator.canShare && navigator.share) {
    let can = false;
    try { can = navigator.canShare({ files: [file] }); } catch (e) {}
    if (can) {
      try {
        await navigator.share({ files: [file], title: 'Sauvegarde Sax Trainer' });
        markDone();
        showToast({ tone: 'x', icon: 'check', title: 'Export terminé', sub: fname });
      } catch (e) {
        if (e && e.name !== 'AbortError') showToast({ tone: 'r', icon: 'warn', title: 'Export impossible', sub: 'Réessaie dans un instant.' });
      }
      return;
    }
  }
  const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  markDone();
  showToast({ tone: 'x', icon: 'check', title: 'Export terminé', sub: fname });
}
async function importFile(file) {
  let data = null, rawFiles = [];
  try { const raw = JSON.parse(await file.text()); data = normalizeDb(raw); if (data && Array.isArray(raw.files)) rawFiles = raw.files; } catch (e) { data = null; }
  if (!data) { showToast({ tone: 'r', icon: 'warn', title: 'Fichier invalide', sub: 'Ce n’est pas une sauvegarde Sax Trainer.' }); return; }
  const ok = await confirmSheet({
    title: 'Remplacer toutes les données actuelles ?',
    message: `Le fichier contient ${plural(data.titles.length, 'morceau', 'morceaux')}, ${plural(data.sessions.length, 'séance', 'séances')} et ${plural(data.comments.length, 'commentaire', 'commentaires')}${rawFiles.length ? `, plus ${plural(rawFiles.length, 'partition', 'partitions')}` : ''}. Les données actuelles seront effacées.`,
    confirmLabel: 'Remplacer', icon: 'import',
  });
  if (!ok) return;
  db = data;
  save();
  applyTheme();
  try {
    await ScoreStore.clear();
    const ids = new Set(db.titles.map((x) => x.id));
    for (const f of rawFiles) {
      if (!f || !ids.has(f.titleId) || typeof f.data !== 'string') continue;
      const buf = base64ToBuf(f.data);
      if (isPdfBuffer(buf)) await ScoreStore.put(f.titleId, { name: String(f.name || 'partition.pdf'), size: buf.byteLength, data: buf, addedAt: new Date().toISOString() });
    }
  } catch (e) { showToast({ tone: 'o', icon: 'warn', title: 'Partitions non restaurées', sub: 'Le stockage du téléphone a refusé les fichiers.' }); }
  ui.play = { state: 'idle' }; ui.lib = { view: 'list', ficheId: null, search: '', histAll: false };
  renderCurrent();
  showToast({ tone: 'x', icon: 'check', title: 'Données importées', sub: plural(db.titles.length, 'morceau', 'morceaux') });
}
$('#importFile').addEventListener('change', (e) => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) importFile(f); });

/* =========================================================
   Onglet Stats
   ========================================================= */
function renderStats() {
  const v = $('#view-stats');
  if (!db.titles.length) {
    v.innerHTML = `<div class="page"><div class="navrow"></div><h1 class="lt">Stats</h1>
      <div class="empty"><div class="emblem">${ic('stats')}</div><div><p class="empty-t">Pas encore de stats</p><p class="empty-s">Ajoute des morceaux et note tes séances : ta progression s’affichera ici.</p></div></div></div>`;
    return;
  }
  const idx = indexStats();
  const played = db.titles.filter((t) => idx.get(t.id).last !== null);
  const avg = played.length ? played.reduce((a, t) => a + idx.get(t.id).last, 0) / played.length : null;
  const total = db.titles.length, perfect = perfectCount(idx);
  const C = 2 * Math.PI * 28, dash = total ? perfect / total * C : 0;
  // 7 derniers jours
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(today); d.setDate(d.getDate() - i); days.push({ d, c: 0 }); }
  for (const s of db.sessions) { const dd = dayDiff(s.date); if (dd >= 0 && dd <= 6) days[6 - dd].c++; }
  const week = days.reduce((a, x) => a + x.c, 0), maxC = Math.max(1, ...days.map((x) => x.c));
  const L = ['D', 'L', 'M', 'M', 'J', 'V', 'S'];
  // Liste
  const rows = db.titles.map((t) => ({ t, st: idx.get(t.id) }));
  if (ui.statsSort === 'name') rows.sort((a, b) => sortByName(a.t, b.t));
  else rows.sort((a, b) => {
    const la = a.st.last === null ? -1 : a.st.last, lb = b.st.last === null ? -1 : b.st.last;
    return la - lb || sortByName(a.t, b.t);
  });
  const seg = (k, l) => `<button data-action="stats-sort" data-s="${k}" aria-pressed="${ui.statsSort === k}">${l}</button>`;
  v.innerHTML = `<div class="page"><div class="navrow"></div><h1 class="lt">Stats</h1>
    <div class="stats">
      <div class="kpis">
        <div class="card kpi"><h2 class="sec">Moyenne globale</h2>
          <p class="num kpi-big"><b>${avg === null ? '–' : fmtDec(avg)}</b><span>/ 10</span></p>
          <span class="kpi-sub">${played.length ? 'dernières notes de ' + plural(played.length, 'titre joué', 'titres joués') : 'aucun titre joué'}</span></div>
        <div class="card kpi"><h2 class="sec">Titres à 10</h2>
          <div style="display:flex;align-items:center;gap:12px">
            <svg viewBox="0 0 64 64" role="img" aria-label="${perfect} titres sur ${total} à 10" style="width:64px;height:64px;flex:none">
              <circle class="ring-bg" cx="32" cy="32" r="28"/>
              ${perfect ? `<circle class="ring-fg" cx="32" cy="32" r="28" transform="rotate(-90 32 32)" style="stroke-dasharray:${dash.toFixed(1)} ${C.toFixed(1)}"/>` : ''}
            </svg>
            <p class="num kpi-big" style="gap:3px"><b style="font-size:34px;line-height:38px;color:var(--ok-tx)">${perfect}</b><span>/ ${total}</span></p>
          </div></div>
      </div>
      <div class="card kpi" style="gap:14px">
        <div style="display:flex;align-items:flex-start;justify-content:space-between">
          <div style="display:flex;flex-direction:column;gap:10px"><h2 class="sec">Séances</h2>
            <p class="num kpi-big" style="gap:6px"><b style="font-size:40px;line-height:44px">${db.sessions.length}</b><span style="font-size:15px;font-weight:600">au total</span></p></div>
          <div style="text-align:right;display:flex;flex-direction:column;gap:6px">
            <span style="font-size:13px;font-weight:600;color:var(--tx2)">7 derniers jours</span>
            <span class="num" style="font-size:28px;line-height:32px;font-weight:800;color:var(--acc-tx)">${week}</span></div>
        </div>
        <div class="week" role="img" aria-label="Séances par jour sur 7 jours : ${days.map((x) => x.c).join(', ')}">
          ${days.map((x) => `<div class="bar7${x.c ? '' : ' zero'}" style="height:${x.c ? Math.max(8, Math.round(x.c / maxC * 48)) : 4}px"></div>`).join('')}
        </div>
        <div class="week-l">${days.map((x) => `<span>${L[x.d.getDay()]}</span>`).join('')}</div>
      </div>
      <section class="fsec" style="gap:10px;margin-top:12px">
        <h2 class="sec" style="padding:0 6px">Par morceau</h2>
        <div class="seg" role="group" aria-label="Tri">${seg('note', 'À travailler d’abord')}${seg('name', 'A → Z')}</div>
        <div class="card">${rows.map(({ t, st }) => `<button class="strow" data-action="open-fiche-from-stats" data-id="${t.id}">
            <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
              <span style="font-size:16px;line-height:21px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.name)}</span>
              <span style="font-size:13px;line-height:17px;color:var(--tx3)">${st.count ? plural(st.count, 'séance', 'séances') : 'Jamais joué'}</span>
            </span>
            ${st.count ? sparkline(st.sessions) : ''}
            ${pill(st.last)}
          </button>`).join('')}</div>
      </section>
    </div></div>`;
}
function sparkline(sessions) {
  const last = sessions.slice(-10), n = last.length;
  const xs = (k) => (n > 1 ? 4 + k * (74 / (n - 1)) : 41);
  const ys = (v) => 4 + (10 - v) * 2.2;
  const pts = last.map((s, k) => `${xs(k).toFixed(1)},${ys(s.note).toFixed(1)}`).join(' ');
  const lv = last[n - 1].note;
  return `<svg class="tone-${tone(lv)}" viewBox="0 0 82 30" aria-hidden="true" style="width:82px;height:30px;flex:none">
    ${n > 1 ? `<polyline class="spk" points="${pts}"/>` : ''}<circle class="spkdot" cx="${xs(n - 1).toFixed(1)}" cy="${ys(lv).toFixed(1)}" r="3.5"/></svg>`;
}

/* =========================================================
   Feuilles modales
   ========================================================= */
function openSheet({ title, body, onSave, canSave = () => true, onMount, onAction }) {
  const ov = document.createElement('div');
  ov.className = 'ov';
  ov.innerHTML = `<div class="scrim" data-sheet="cancel"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="grabber"></div>
      <div class="sheet-head">
        <button class="lnk" data-sheet="cancel" style="justify-self:start">Annuler</button>
        <h1>${esc(title)}</h1>
        <button class="lnk strong" data-sheet="save">Enregistrer</button>
      </div>
      <div class="sheet-body">${body}</div>
    </div>`;
  $('#overlays').appendChild(ov);
  const saveBtn = $('[data-sheet="save"]', ov);
  const refresh = () => { saveBtn.disabled = !canSave(ov); };
  const close = () => {
    document.activeElement && document.activeElement.blur && document.activeElement.blur();
    ov.classList.remove('show'); setTimeout(() => ov.remove(), 320);
  };
  ov.addEventListener('input', refresh);
  ov.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-sheet]'); if (!b) return;
    const a = b.dataset.sheet;
    if (a === 'cancel') close();
    else if (a === 'save') { if (!saveBtn.disabled && onSave(ov) !== false) close(); }
    else if (onAction) onAction(a, close);
  });
  if (onMount) onMount(ov);
  refresh();
  requestAnimationFrame(() => ov.classList.add('show'));
  return ov;
}
function confirmSheet({ title, message = '', confirmLabel = 'Confirmer', icon = null, danger = true }) {
  return new Promise((resolve) => {
    const ov = document.createElement('div');
    ov.className = 'ov';
    ov.innerHTML = `<div class="scrim" data-c="no"></div>
      <div class="as-wrap" role="alertdialog" aria-modal="true" aria-label="${esc(title)}">
        <div class="asheet">
          <div class="as-msg"><p class="as-t">${esc(title)}</p>${message ? `<p class="as-s">${esc(message)}</p>` : ''}</div>
          <button class="asbtn${danger ? ' danger' : ''}" data-c="yes">${icon ? ic(icon) : ''}${esc(confirmLabel)}</button>
        </div>
        <button class="asbtn cancel" data-c="no">Annuler</button>
      </div>`;
    $('#overlays').appendChild(ov);
    let done = false;
    ov.addEventListener('click', (e) => {
      const b = e.target.closest('[data-c]'); if (!b || done) return;
      done = true;
      ov.classList.remove('show'); setTimeout(() => ov.remove(), 300);
      resolve(b.dataset.c === 'yes');
    });
    requestAnimationFrame(() => ov.classList.add('show'));
  });
}

/* =========================================================
   Interactions : clics délégués
   ========================================================= */
let suppressClickUntil = 0;
const actions = {
  tab: (el) => showTab(el.dataset.tab),
  draw: () => startDraw(),
  'first-add': () => { showTab('library'); openTitleSheet(); },
  'goto-todo': () => { ui.commentsFilter = 'todo'; showTab('comments'); },
  note: (el) => {
    if (ui.play.state !== 'active') return;
    const n = Number(el.dataset.n);
    ui.play.note = n;
    $$('.gbtn', $('#view-play')).forEach((b) => b.setAttribute('aria-checked', String(Number(b.dataset.n) === n)));
    $('#validateBtn').disabled = false;
  },
  validate: () => validatePlay(),
  'score-open': (el) => openScore(el.dataset.id),
  'score-add': (el) => pickScore(el.dataset.id),
  'score-delete': (el) => removeScore(el.dataset.id),
  'comment-toggle': (el) => toggleComment(el.dataset.id),
  'comment-edit': (el) => openCommentSheet({ commentId: el.dataset.id }),
  'comment-delete': (el) => deleteComment(el.dataset.id),
  'comment-new': () => openCommentSheet(),
  'comment-new-for': (el) => openCommentSheet({ titleId: el.dataset.id }),
  'comments-filter': (el) => { ui.commentsFilter = el.dataset.f; renderComments(); },
  'title-new': () => openTitleSheet(),
  'title-edit': (el) => openTitleSheet(el.dataset.id),
  'title-delete': (el) => deleteTitle(el.dataset.id),
  'open-fiche': (el) => { ui.lib.view = 'fiche'; ui.lib.ficheId = el.dataset.id; ui.lib.histAll = false; renderLibrary(); $('#view-library').scrollTop = 0; },
  'open-fiche-from-stats': (el) => { ui.lib.view = 'fiche'; ui.lib.ficheId = el.dataset.id; ui.lib.histAll = false; showTab('library', { keepLib: true, keepScroll: true }); $('#view-library').scrollTop = 0; },
  'lib-back': () => { ui.lib.view = 'list'; ui.lib.ficheId = null; renderLibrary(); },
  'hist-toggle': () => { ui.lib.histAll = !ui.lib.histAll; renderFiche(); },
  'play-title': (el) => { const id = el.dataset.id; db.meta.lastDrawnTitleId = id; save(); showTab('play'); startPlaying(id); },
  'lib-data': () => { const s = $('#reglages'); if (s) s.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
  'set-theme': (el) => {
    db.meta.theme = el.dataset.theme; save(); applyTheme();
    $$('[data-action="set-theme"]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.theme === db.meta.theme)));
  },
  export: () => exportData(),
  import: () => $('#importFile').click(),
  'stats-sort': (el) => { ui.statsSort = el.dataset.s; renderStats(); },
};
document.addEventListener('click', (e) => {
  if (e.target.closest('.ov, .cele-ov')) return; // gérés par leurs propres écouteurs
  const el = e.target.closest('[data-action]');
  const wrap = e.target.closest('.rwrap.swipeable');
  if (Date.now() < suppressClickUntil && wrap) return;
  if (wrap && wrap.classList.contains('open') && !e.target.closest('.swdel')) { closeSwipes(); return; }
  if (!e.target.closest('.rwrap.open')) closeSwipes();
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.action];
  if (fn) fn(el, e);
});

/* Appui maintenu (− / + du tempo dans le formulaire) */
const holdHandlers = {
  ftempo: (b) => {
    const inp = $('#fTempo'); if (!inp) return;
    const cur = Number(inp.value);
    inp.value = clampTempo((Number.isFinite(cur) && inp.value !== '' ? cur : CONFIG.TEMPO_DEFAULT) + Number(b.dataset.step));
    const echo = $('#fTempoEcho'); if (echo) echo.textContent = inp.value;
  },
};
document.addEventListener('pointerdown', (e) => {
  const b = e.target.closest('[data-hold]'); if (!b || b.disabled) return;
  e.preventDefault();
  const fn = () => holdHandlers[b.dataset.hold](b);
  fn();
  let timer = setTimeout(function rep() { fn(); timer = setTimeout(rep, 70); }, 420);
  const stop = () => { clearTimeout(timer); window.removeEventListener('pointerup', stop); window.removeEventListener('pointercancel', stop); b.removeEventListener('pointerleave', stop); };
  window.addEventListener('pointerup', stop); window.addEventListener('pointercancel', stop); b.addEventListener('pointerleave', stop);
});
document.addEventListener('click', (e) => { const b = e.target.closest('[data-hold]'); if (b && e.detail === 0) holdHandlers[b.dataset.hold](b); });

/* Balayage pour supprimer un commentaire */
let sw = null;
function closeSwipes(except) { $$('.rwrap.open').forEach((w) => { if (w !== except) w.classList.remove('open'); }); }
document.addEventListener('touchstart', (e) => {
  const row = e.target.closest('.rwrap.swipeable .crow');
  if (!row) { sw = null; return; }
  const wrap = row.parentElement;
  closeSwipes(wrap);
  sw = { row, wrap, x: e.touches[0].clientX, y: e.touches[0].clientY, base: wrap.classList.contains('open') ? -96 : 0, cur: 0, active: false, decided: false };
}, { passive: true });
document.addEventListener('touchmove', (e) => {
  if (!sw) return;
  const dx = e.touches[0].clientX - sw.x, dy = e.touches[0].clientY - sw.y;
  if (!sw.decided && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) { sw.decided = true; sw.active = Math.abs(dx) > Math.abs(dy); }
  if (!sw.active) return;
  e.preventDefault();
  sw.cur = Math.min(0, Math.max(-130, sw.base + dx));
  sw.row.style.transition = 'none';
  sw.row.style.transform = `translateX(${sw.cur}px)`;
}, { passive: false });
document.addEventListener('touchend', () => {
  if (!sw) return;
  if (sw.active) {
    sw.row.style.transition = ''; sw.row.style.transform = '';
    sw.wrap.classList.toggle('open', sw.cur < -48);
    suppressClickUntil = Date.now() + 350;
  }
  sw = null;
});

/* Clavier : masquer barre d'onglets et dock pendant la saisie */
document.addEventListener('focusin', (e) => { if (e.target.matches('#view-play textarea, #view-library input[type=search]')) document.body.classList.add('typing'); });
document.addEventListener('focusout', () => setTimeout(() => { if (!document.activeElement || !document.activeElement.matches('#view-play textarea, #view-library input[type=search]')) document.body.classList.remove('typing'); }, 50));

/* =========================================================
   Démarrage
   ========================================================= */
renderTabbar();
showTab('play');
ScoreStore.refresh().then(() => { if (ui.play.state !== 'drawing' && !document.querySelector('.ov')) renderCurrent(); });
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
// Accès console pour tester ou régler l'algorithme
window.SaxTrainer = { CONFIG, computeWeights, pickWeighted, ScoreStore, get db() { return db; } };
